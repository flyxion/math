name: Verify

# Structural honesty for the corpus: the hash-chained ledger must verify, and
# the exact SymPy checks must pass, on every change.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger:
    name: ledger (hash chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the append-only, hash-chained event log
        run: make -C cubic_rhombus_math ledger

  checks:
    name: exact checks (SymPy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SymPy
        run: python -m pip install --upgrade pip sympy
      - name: Run the closed-form and symbolic checks
        run: make -C cubic_rhombus_math verify
